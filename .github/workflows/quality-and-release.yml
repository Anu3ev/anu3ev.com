name: Quality and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Content, types, tests and static export
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up supported Node LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate content, lint, types and unit contracts
        run: pnpm check
      - name: Generate production HTML and metadata
        run: pnpm build
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test the export and real pagination in one browser worker
        run: pnpm test:e2e
      - name: Determine versioned release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: pnpm release:plan
      - name: Package the exact tested export
        run: tar -czf "$RUNNER_TEMP/portfolio.tar.gz" -C .output/public .
      - name: Preserve the tested export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-${{ github.sha }}
          path: ${{ runner.temp }}/portfolio.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-reports-${{ github.sha }}
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 3

  release:
    name: Publish the tested version
    needs: quality
    if: needs.quality.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the tested export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-${{ github.sha }}
          path: release
      - name: Publish immutable tag and release archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          existing_refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')
          if printf '%s\n' "$existing_refs" | grep -Fxq "refs/tags/$RELEASE_TAG"; then
            existing_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo 'An existing version points to another commit; refusing to move its tag.' >&2
              exit 1
            fi
            if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists for this commit."
              exit 0
            fi
          fi
          mv release/portfolio.tar.gz "release/anu3ev-portfolio-$RELEASE_TAG.tar.gz"
          gh release create "$RELEASE_TAG" "release/anu3ev-portfolio-$RELEASE_TAG.tar.gz" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
