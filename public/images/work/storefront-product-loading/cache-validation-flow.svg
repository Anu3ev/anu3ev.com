<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#101216"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#86adff"/></marker>
  </defs>
  <g font-family="Inter, sans-serif">
    <text x="60" y="78" fill="#a1a3a8" font-size="18" letter-spacing="2">PRODUCT CACHE CHECK ON PAGE LOAD</text>
    <text x="60" y="118" fill="#ecedee" font-size="30" font-weight="600">Request only the products that changed</text>

    <g fill="#181a1f" stroke="#2d3139" stroke-width="2">
      <rect x="60" y="200" width="270" height="180" rx="14"/>
      <rect x="420" y="200" width="300" height="180" rx="14"/>
      <rect x="420" y="470" width="300" height="140" rx="14"/>
    </g>
    <g fill="#181a1f" stroke="#547bc5" stroke-width="2">
      <rect x="810" y="170" width="330" height="150" rx="14"/>
      <rect x="810" y="370" width="330" height="170" rx="14"/>
    </g>

    <text x="85" y="240" fill="#86adff" font-size="15" letter-spacing="2">LIQUID TEMPLATE</text>
    <text x="85" y="285" fill="#ecedee" font-size="22">Renders each product</text>
    <text x="85" y="315" fill="#ecedee" font-size="22">with its update time</text>
    <text x="85" y="352" fill="#a9c4f5" font-size="15" font-family="monospace">data-product-updated-at</text>

    <text x="445" y="240" fill="#86adff" font-size="15" letter-spacing="2">COMMONJS</text>
    <text x="445" y="285" fill="#ecedee" font-size="22">Compares the timestamp</text>
    <text x="445" y="315" fill="#ecedee" font-size="22">with the cached record</text>
    <text x="445" y="352" fill="#a1a3a8" font-size="16">and checks the variant data</text>

    <text x="445" y="510" fill="#86adff" font-size="15" letter-spacing="2">INDEXEDDB (BROWSER)</text>
    <text x="445" y="550" fill="#ecedee" font-size="20">Product data</text>
    <text x="445" y="582" fill="#a9c4f5" font-size="15" font-family="monospace">+ originalUpdatedAt</text>

    <text x="835" y="210" fill="#86adff" font-size="15" letter-spacing="2">SAME TIME, DATA COMPLETE</text>
    <text x="835" y="255" fill="#ecedee" font-size="22">Reuse the cached product</text>
    <text x="835" y="290" fill="#a1a3a8" font-size="17">No request</text>

    <text x="835" y="410" fill="#86adff" font-size="15" letter-spacing="2">NEW, CHANGED OR INCOMPLETE</text>
    <text x="835" y="455" fill="#ecedee" font-size="22">Fetch only these products</text>
    <text x="835" y="490" fill="#a1a3a8" font-size="17">and update their records</text>

    <g fill="none" stroke="#86adff" stroke-width="2.5">
      <path d="M332 290h82" marker-end="url(#arrow)"/>
      <path d="M570 384v80" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M722 260h82" marker-end="url(#arrow)"/>
      <path d="M722 320c40 0 50 130 82 130" marker-end="url(#arrow)"/>
      <path d="M975 544v36h-249" marker-end="url(#arrow)"/>
    </g>

    <text x="60" y="645" fill="#a1a3a8" font-size="16">Templates that do not pass a timestamp keep the previous time-based check.</text>
  </g>
</svg>
