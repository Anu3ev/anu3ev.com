<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Inter, sans-serif">
  <rect width="1200" height="675" fill="#101216"/>
  <text x="64" y="78" fill="#ecedee" font-size="30" font-weight="600">Multi-warehouse cart: queued changes, one grouped request</text>
  <text x="64" y="112" fill="#a1a3a8" font-size="18">Diagram of the update flow. Products and quantities are illustrative.</text>

  <g font-size="15" font-weight="600" letter-spacing="1.5" fill="#86adff">
    <text x="64" y="172">BUYER'S CHANGES</text>
    <text x="430" y="172">SHARED CART LIBRARY</text>
    <text x="846" y="172">CART ON THE SERVER</text>
  </g>

  <g fill="#181a1f" stroke="#2d3139" stroke-width="2">
    <rect x="64" y="195" width="290" height="84" rx="12"/>
    <rect x="64" y="295" width="290" height="84" rx="12"/>
    <rect x="64" y="395" width="290" height="84" rx="12"/>
  </g>
  <g font-size="16" fill="#a1a3a8">
    <text x="88" y="228">Main warehouse</text>
    <text x="88" y="328">Partner warehouse</text>
    <text x="88" y="428">Partner warehouse</text>
  </g>
  <g font-size="20" fill="#ecedee">
    <text x="88" y="258">Product A → 5 units</text>
    <text x="88" y="358">Product A → 8 units</text>
    <text x="88" y="458">Product B → 2 units</text>
  </g>

  <rect x="430" y="195" width="300" height="284" rx="14" fill="#181a1f" stroke="#547bc5" stroke-width="2"/>
  <text x="454" y="230" fill="#a1a3a8" font-size="16">Queue of pending changes</text>
  <g fill="#101216" stroke="#2d3139" stroke-width="2">
    <rect x="454" y="250" width="252" height="46" rx="8"/>
    <rect x="454" y="308" width="252" height="46" rx="8"/>
    <rect x="454" y="366" width="252" height="46" rx="8"/>
  </g>
  <g font-size="18" fill="#ecedee">
    <text x="474" y="279">Main · A = 5</text>
    <text x="474" y="337">Partner · A = 8</text>
    <text x="474" y="395">Partner · B = 2</text>
  </g>
  <text x="454" y="452" fill="#a9c4f5" font-size="18" font-weight="600">Grouped by warehouse</text>

  <rect x="846" y="195" width="290" height="284" rx="14" fill="#181a1f" stroke="#2d3139" stroke-width="2"/>
  <g fill="#101216" stroke="#547bc5" stroke-width="2">
    <rect x="866" y="215" width="250" height="100" rx="10"/>
    <rect x="866" y="331" width="250" height="128" rx="10"/>
  </g>
  <g font-size="17" fill="#a9c4f5" font-weight="600">
    <text x="886" y="249">Main warehouse group</text>
    <text x="886" y="365">Partner warehouse group</text>
  </g>
  <g font-size="18" fill="#ecedee">
    <text x="886" y="290">Product A · 5</text>
    <text x="886" y="403">Product A · 8</text>
    <text x="886" y="436">Product B · 2</text>
  </g>

  <g fill="none" stroke="#86adff" stroke-width="3">
    <path d="M364 337h56m-12-12 12 12-12 12"/>
    <path d="M740 337h96m-12-12 12 12-12 12"/>
  </g>
  <text x="788" y="318" text-anchor="middle" fill="#86adff" font-size="16" font-weight="600">1 request</text>

  <rect x="64" y="523" width="1072" height="96" rx="12" fill="#181a1f" stroke="#2d3139" stroke-width="2"/>
  <text x="88" y="560" fill="#a1a3a8" font-size="15" font-weight="600" letter-spacing="1.5">BEFORE</text>
  <text x="88" y="594" fill="#ecedee" font-size="19">Separate requests for different warehouses could overlap and overwrite each other, losing a selection.</text>
</svg>
