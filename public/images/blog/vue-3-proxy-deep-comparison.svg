<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, sans-serif">
  <title>700 items, 244,650 deep comparisons through Vue Proxies, and two fixes</title>
  <rect width="1200" height="630" fill="#101216"/>
  <text x="70" y="88" fill="#a1a3a8" font-size="26">After the Vue 3 migration: uniqWith(items, isEqual)</text>

  <rect x="70" y="120" width="500" height="440" rx="20" fill="#181a1f" stroke="#2d3139" stroke-width="2"/>
  <text x="110" y="182" fill="#ecedee" font-size="30" font-weight="600">700 domain zones</text>
  <text x="110" y="226" fill="#a1a3a8" font-size="26" font-family="ui-monospace, monospace">700 × 699 / 2</text>
  <text x="110" y="320" fill="#86adff" font-size="84" font-weight="700">244,650</text>
  <text x="110" y="364" fill="#ecedee" font-size="28">deep comparisons</text>
  <line x1="110" y1="400" x2="530" y2="400" stroke="#2d3139" stroke-width="2"/>
  <text x="110" y="446" fill="#a9c4f5" font-size="24">every property read goes</text>
  <text x="110" y="480" fill="#a9c4f5" font-size="24">through Vue's Proxy handlers</text>
  <text x="110" y="530" fill="#a1a3a8" font-size="24">≈ 12 s to open the list</text>

  <path d="M590 340 H632" stroke="#547bc5" stroke-width="4" fill="none"/>
  <path d="M628 326 L646 340 L628 354 Z" fill="#547bc5"/>

  <rect x="660" y="120" width="470" height="205" rx="20" fill="#181a1f" stroke="#547bc5" stroke-width="2"/>
  <text x="696" y="176" fill="#86adff" font-size="24" font-weight="600">Fix 1 · local mode</text>
  <text x="696" y="222" fill="#ecedee" font-size="30" font-weight="600">Don't build the cache</text>
  <text x="696" y="262" fill="#a1a3a8" font-size="24">The list is already there.</text>
  <text x="696" y="296" fill="#a9c4f5" font-size="24">The delay disappeared.</text>

  <rect x="660" y="355" width="470" height="205" rx="20" fill="#181a1f" stroke="#2d3139" stroke-width="2"/>
  <text x="696" y="411" fill="#86adff" font-size="24" font-weight="600">Fix 2 · external search</text>
  <text x="696" y="458" fill="#ecedee" font-size="25" font-family="ui-monospace, monospace">isEqual(toRaw(a), toRaw(b))</text>
  <text x="696" y="498" fill="#a1a3a8" font-size="24">Same deep comparison,</text>
  <text x="696" y="532" fill="#a9c4f5" font-size="24">no reactive reads.</text>
</svg>
