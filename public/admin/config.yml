# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.248.1/schema/sveltia-cms.json
backend:
  name: github
  repo: Anu3ev/anu3ev.com
  branch: master
  auth_methods: [token]

publish_mode: editorial_workflow
media_folder: public/images
public_folder: /images
logo:
  src: /favicon.svg
  show_in_header: true

i18n:
  structure: multiple_folders
  locales: [en, ru]
  default_locale: en
  initial_locales: all
  omit_default_locale_from_preview_path: true

collections:
  - name: posts
    label: Articles
    label_singular: Article
    folder: content/{{locale}}/posts
    i18n: true
    create: true
    slug: '{{fields.slug}}'
    preview_path: /{{locale}}/blog/{{slug}}/
    summary: '{{title}} · {{date}}'
    fields:
      - { name: locale, widget: hidden, default: '{{locale}}', i18n: true }
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: slug, label: URL slug, widget: string, i18n: duplicate, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase Latin letters, numbers and hyphens'], hint: Do not change an already published article slug. }
      - { name: description, label: Card and SEO description, widget: text, i18n: true }
      - { name: published, label: Publish on the site, widget: boolean, default: false, i18n: duplicate, hint: Drafts are excluded from the public export. Complete both language versions before publishing. }
      - { name: date, label: Publication date, widget: datetime, type: date, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate, hint: The site timezone is Asia/Tbilisi. Future-dated articles need a new build on or after that date. }
      - { name: cover, label: Cover, widget: image, i18n: duplicate_if_empty, hint: Prefer WebP under 200 KB at 1200 × 630 px. }
      - { name: coverAlt, label: Cover alt text, widget: string, i18n: true }
      - { name: category, label: Category, widget: string, i18n: true }
      - { name: tags, label: Tags, widget: list, i18n: duplicate }
      - { name: readingMinutes, label: Reading time in minutes, widget: number, value_type: int, min: 1, max: 60, default: 5, i18n: duplicate }
      - { name: body, label: Body, widget: markdown, i18n: true, hint: Use H2/H3. The page creates H1 from the title. Put HTML examples in fenced code blocks. }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/{{locale}}/projects
    i18n: true
    create: true
    slug: '{{fields.slug}}'
    preview_path: /{{locale}}/work/{{slug}}/
    summary: '{{title}} · {{year}}'
    fields:
      - { name: locale, widget: hidden, default: '{{locale}}', i18n: true }
      - { name: title, label: Case title, widget: string, i18n: true }
      - { name: slug, label: URL slug, widget: string, i18n: duplicate, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase Latin letters, numbers and hyphens'], hint: Do not change an already published project slug. }
      - { name: description, label: Card and SEO description, widget: text, i18n: true }
      - { name: published, label: Publish on the site, widget: boolean, default: false, i18n: duplicate }
      - { name: cover, label: Image, widget: image, i18n: duplicate_if_empty, hint: Prefer WebP under 200 KB at 1200 × 675 px. }
      - { name: coverAlt, label: Image alt text, widget: string, i18n: true }
      - { name: category, label: Category, widget: string, i18n: true, default: Product engineering, default_localized: { ru: Продуктовая разработка } }
      - { name: year, label: Period, widget: string, i18n: duplicate }
      - { name: role, label: My role, widget: string, i18n: true }
      - { name: stack, label: Technologies, widget: list, i18n: duplicate }
      - { name: featured, label: Feature on Home, widget: boolean, default: false, i18n: duplicate }
      - { name: order, label: Sort order, widget: number, value_type: int, min: 0, max: 999, default: 10, i18n: duplicate }
      - { name: repository, label: Public repository, widget: string, required: false, i18n: duplicate, hint: HTTPS only. Do not include private employer repositories. }
      - { name: demo, label: Interactive demo, widget: string, required: false, i18n: duplicate, hint: HTTPS only. The demo opens separately and is not loaded in the shared layout. }
      - { name: body, label: Case study, widget: markdown, i18n: true, hint: Context → my role → decisions → constraints → outcome. Start headings at H2. }

  - name: settings
    label: Site settings
    publish_mode: simple
    files:
      - name: profile
        label: Profile and contacts
        file: content/settings/profile.json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: name_ru, label: Name — Russian, widget: string }
          - { name: photo, label: Photo, widget: image, hint: Prefer WebP under 200 KB at 600 × 600 px. }
          - { name: email, label: Email, widget: string }
          - { name: github, label: GitHub URL, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - { name: telegram, label: Telegram URL, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: available, label: Available for opportunities, widget: boolean }
          - { name: headline_en, label: Headline — English, widget: string }
          - { name: headline_ru, label: Headline — Russian, widget: string }
          - { name: bio_en, label: Bio — English, widget: text }
          - { name: bio_ru, label: Bio — Russian, widget: text }

      - name: pages
        label: Page copy and career history
        file: content/settings/pages.json
        fields:
          - name: en
            label: English
            widget: object
            collapsed: true
            hint: Headings allow 4–120 characters and body text 20–1600. Changes are saved to GitHub and validated before build.
            fields: &page_fields
              - name: home
                label: Home
                widget: object
                collapsed: true
                fields:
                  - { name: seoTitle, label: SEO title, widget: string }
                  - { name: pinnedTitle, label: Pinned note title, widget: string }
                  - { name: pinnedBody, label: Pinned note, widget: text }
                  - { name: tags, label: Profile topics, widget: list }
              - name: about
                label: About
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: intro, label: Introduction, widget: text }
                  - { name: body, label: Body, widget: text }
                  - { name: story, label: How I started in development, widget: text }
                  - { name: technologies, label: Tools, widget: list }
                  - { name: experienceTitle, label: Career heading, widget: string }
                  - name: experience
                    label: Career history
                    widget: list
                    summary: '{{fields.role}} · {{fields.company}}'
                    fields:
                      - { name: company, label: Company, widget: string }
                      - { name: role, label: Role, widget: string }
                      - { name: start, label: Start, widget: string, pattern: ['^[0-9]{4}-(0[1-9]|1[0-2])$', 'Enter the year and month as YYYY-MM'] }
                      - { name: end, label: End, widget: string, required: false, default: '', pattern: ['^([0-9]{4}-(0[1-9]|1[0-2]))?$', 'Enter YYYY-MM or leave blank'], hint: A blank value means a current position. }
                      - { name: description, label: Responsibilities, widget: text }
                  - name: principles
                    label: Principles
                    widget: list
                    summary: '{{fields.title}}'
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: description, label: Description, widget: text }
              - name: portfolio
                label: Portfolio
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: intro, label: Introduction, widget: text }
                  - name: summary
                    label: Introductory facts
                    widget: list
                    min: 1
                    max: 4
                    summary: '{{fields.value}} · {{fields.label}}'
                    fields:
                      - { name: value, label: Value, widget: string }
                      - { name: label, label: Description, widget: string }
              - name: blog
                label: Blog
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: intro, label: Introduction, widget: text }
              - name: contact
                label: Contacts
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: intro, label: Introduction, widget: text }
                  - { name: note, label: Email note, widget: text }
                  - { name: arrangements, label: Working arrangements, widget: list }
              - name: sidebar
                label: Right sidebar
                widget: object
                collapsed: true
                fields:
                  - { name: bio, label: Short bio, widget: text }
                  - { name: focusTitle, label: Focus heading, widget: string }
                  - { name: focusDetails, label: Current focus, widget: text }
                  - { name: focusTags, label: Focus technologies, widget: list }
              - name: collaboration
                label: Collaboration
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Description, widget: text }
              - name: cta
                label: Contact callout
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Description, widget: text }
              - name: privacy
                label: Privacy
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: updated, label: Updated date, widget: datetime, type: date, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
                  - { name: body, label: Hosting and data, widget: text }
                  - { name: contact, label: Correspondence, widget: text }
                  - { name: storage, label: Browser storage, widget: text }
          - name: ru
            label: Russian
            widget: object
            collapsed: true
            hint: Complete the Russian version of the same sections. Career dates use YYYY-MM.
            fields: *page_fields
